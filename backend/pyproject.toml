[project]
name = "asistrader"
version = "0.1.0"
description = "Trading operations management system"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "brotli-asgi==1.6.0",
    "uvicorn[standard]==0.52.3",
    "sqlalchemy==2.0.52",
    "psycopg2-binary==2.9.12",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "alembic==1.19.1",
    "yfinance==1.6.0",
    "pandas==3.0.5",
    "httpx==0.28.1",
    "python-jose[cryptography]==3.5.0",
    "bcrypt==5.0.0",
    "email-validator==2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asistrader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
